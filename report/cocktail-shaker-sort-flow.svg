</text>

<path class="arrow"
      d="M830 697 H760 V665 H320"/>


<!-- ========================================================= -->
<!-- FORWARD FINISHED -> SWAPPED CHECK -->
<!-- ========================================================= -->

<rect class="decision"
      x="20"
      y="570"
      width="290"
      height="64"
      rx="10"/>

<text x="165"
      y="608"
      text-anchor="middle">
    swapped == false ?
</text>


<!-- forward false -> END -->
<path class="arrow"
      d="M20 602 H5 V830 H155"/>

<text x="72"
      y="590">
    예
</text>

<rect class="end"
      x="30"
      y="830"
