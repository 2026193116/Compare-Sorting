      height="60"
      rx="10"/>

<text x="155"
      y="866"
      text-anchor="middle">
    정렬 완료 → 종료
</text>


<!-- forward true -> right-- -->
<path class="arrow"
      d="M310 602 H350 V790 H450"/>

<text x="345"
      y="585">
    아니오
</text>


<!-- ========================================================= -->
<!-- RIGHT-- -->
<!-- ========================================================= -->

<rect class="step"
      x="450"
      y="760"
      width="180"
      height="58"
      rx="10"/>

<text x="540"
      y="795"
      text-anchor="middle">
    right--
</text>

<path class="arrow"
      d="M630 789 H680"/>


<!-- ========================================================= -->
<!-- RESET SWAPPED -->
<!-- ========================================================= -->

<rect class="step"
      x="680"
      y="760"
      width="230"
      height="58"
      rx="10"/>

<text x="795"
      y="795"
      text-anchor="middle">
    swapped = false
</text>

<path class="arrow"
      d="M795 818 V850"/>


<!-- ========================================================= -->
<!-- BACKWARD LOOP INIT -->
<!-- ========================================================= -->

<rect class="step"
      x="680"
      y="850"
      width="230"
      height="58"
      rx="10"/>

<text x="795"
      y="885"
      text-anchor="middle">
    index = right
</text>

<!-- ========================================================= -->
<!-- BACKWARD LOOP CONDITION -->
<!-- ========================================================= -->

<path class="arrow"
      d="M680 879 H600 V930"/>

<rect class="decision"
      x="430"
      y="930"
      width="340"
      height="64"
      rx="10"/>

<text x="600"
      y="968"
      text-anchor="middle">
    index &gt; left ?
</text>


<!-- ========================================================= -->
<!-- BACKWARD COMPARISON -->
<!-- ========================================================= -->

<!-- This section is intentionally placed beyond the main -->
<!-- flow to keep the major flow readable. -->

<path class="arrow"
      d="M770 962 H1040 V525"/>

<text x="850"
      y="950"
      text-anchor="middle">
    예
</text>

<rect class="decision"
      x="880"
      y="445"
      width="230"
      height="64"
      rx="10"/>

<text x="995"
      y="473"
      text-anchor="middle">
    result[index - 1]
</text>

<text x="995"
      y="495"
      text-anchor="middle">
    &gt; result[index] ?
</text>


<!-- backward comparison -> swap -->
<path class="arrow"
      d="M880 477 H820 V410"/>

<text x="850"
      y="465">
    예
</text>


<rect class="step"
      x="690"
      y="350"
      width="230"
      height="60"
      rx="10"/>

<text x="805"
      y="378"
      text-anchor="middle">
    swap
</text>

<text x="805"
      y="400"
      text-anchor="middle">
    moves += 3
</text>


<!-- backward comparison no -> index-- -->
<path class="arrow"
      d="M1110 477 H1140 V350 H960"/>

<text x="1115"
      y="465">
    아니오
</text>


<rect class="step"
      x="950"
      y="300"
      width="150"
      height="58"
      rx="10"/>

<text x="1025"
      y="335"
      text-anchor="middle">
    index--
</text>


<!-- backward swap -> index-- -->
<path class="arrow"
      d="M805 350 V330 H950"/>


<!-- index-- -> backward condition -->
<path class="arrow"
      d="M950 358 V962 H770"/>


<!-- ========================================================= -->
<!-- BACKWARD LOOP FINISHED -> left++ -->
<!-- ========================================================= -->

<path class="arrow"
      d="M430 962 H360 V920"/>

<text x="390"
      y="950">
    아니오
</text>

<rect class="step"
      x="240"
      y="850"
      width="180"
      height="58"
      rx="10"/>

<text x="330"
      y="885"
      text-anchor="middle">
    left++
</text>


<!-- left++ -> while condition -->
<path class="arrow"
      d="M240 879 H120 V192 H435"/>

<text class="note"
      x="145"
      y="840">
    다음 왕복
</text>


