<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
<style>text{font:13px sans-serif}.title{font-size:20px;font-weight:bold}.axis{stroke:#555}.grid{stroke:#ddd}.legend{font-size:12px}</style>
<text class="title" x="80" y="30">Theoretical growth (conceptual)</text>
<text transform="translate(18 225) rotate(-90)" text-anchor="middle">relative cost</text>
<line class="axis" x1="80" y1="65" x2="80" y2="385"/><line class="axis" x1="80" y1="385" x2="815" y2="385"/>
<line class="grid" x1="80" y1="385" x2="815" y2="385"/><line class="grid" x1="80" y1="305" x2="815" y2="305"/><line class="grid" x1="80" y1="225" x2="815" y2="225"/><line class="grid" x1="80" y1="145" x2="815" y2="145"/><line class="grid" x1="80" y1="65" x2="815" y2="65"/>
<polyline fill="none" stroke="#4e79a7" stroke-width="3" points="80,365 300,330 520,250 740,120"/><polyline fill="none" stroke="#59a14f" stroke-width="3" points="80,370 300,360 520,345 740,325"/><polyline fill="none" stroke="#e15759" stroke-width="3" points="80,370 300,350 520,270 740,75"/>
<text x="80" y="410">n</text><text x="300" y="410">n²</text><text x="520" y="410">n³</text><text x="740" y="410">n⁴</text>
<line x1="80" y1="442" x2="100" y2="442" stroke="#4e79a7" stroke-width="3"/><text class="legend" x="106" y="446">Shell: average O(n^1.5), worst O(n²)</text>
<line x1="340" y1="442" x2="360" y2="442" stroke="#59a14f" stroke-width="3"/><text class="legend" x="366" y="446">Counting: O(n+k)</text>
<line x1="570" y1="442" x2="590" y2="442" stroke="#e15759" stroke-width="3"/><text class="legend" x="596" y="446">Cocktail: O(n²)</text>
</svg>
