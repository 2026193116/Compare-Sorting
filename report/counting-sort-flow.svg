<svg xmlns="http://www.w3.org/2000/svg"
     width="1250"
     height="1900"
     viewBox="0 0 1250 1900">

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11"
            refX="10" refY="5.5" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#374151"/>
    </marker>

    <marker id="arrowBlue" markerWidth="11" markerHeight="11"
            refX="10" refY="5.5" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>

    <marker id="arrowGreen" markerWidth="11" markerHeight="11"
            refX="10" refY="5.5" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#059669"/>
    </marker>

    <marker id="arrowOrange" markerWidth="11" markerHeight="11"
            refX="10" refY="5.5" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#d97706"/>
    </marker>

    <style>
      .title {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #111827;
      }

      .subtitle {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 17px;
        fill: #6b7280;
      }

      .box {
        fill: #ffffff;
        stroke: #374151;
        stroke-width: 2;
      }

      .inputBox {
        fill: #f9fafb;
        stroke: #4b5563;
        stroke-width: 2;
      }

      .scanBox {
        fill: #eff6ff;
        stroke: #2563eb;
        stroke-width: 2.5;
      }

      .countBox {
        fill: #ecfdf5;
        stroke: #059669;
        stroke-width: 2.5;
      }

      .prefixBox {
        fill: #f0fdfa;
        stroke: #0f766e;
        stroke-width: 2.5;
      }

      .stableBox {
        fill: #fff7ed;
        stroke: #d97706;
        stroke-width: 2.5;
      }

      .copyBox {
        fill: #f5f3ff;
        stroke: #7c3aed;
        stroke-width: 2.5;
      }

      .decision {
        fill: #fffbeb;
        stroke: #d97706;
        stroke-width: 2;
      }

      .finish {
        fill: #f3f4f6;
        stroke: #374151;
        stroke-width: 2;
      }

      .text {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 19px;
        fill: #111827;
        text-anchor: middle;
      }

      .small {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 16px;
        fill: #4b5563;
        text-anchor: middle;
      }

      .sectionBlue {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #1d4ed8;
        text-anchor: middle;
      }

      .sectionGreen {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #047857;
        text-anchor: middle;
      }

      .sectionTeal {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #0f766e;
        text-anchor: middle;
      }

      .sectionOrange {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #b45309;
        text-anchor: middle;
      }

      .sectionPurple {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #6d28d9;
        text-anchor: middle;
      }

      .decisionText {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #92400e;
        text-anchor: middle;
      }

      .arrow {
        stroke: #374151;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }

      .arrowBlue {
        stroke: #2563eb;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowBlue);
      }

      .arrowGreen {
        stroke: #059669;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowGreen);
      }

      .arrowOrange {
        stroke: #d97706;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowOrange);
      }

      .loop {
        stroke: #6b7280;
        stroke-width: 2;
        stroke-dasharray: 7 5;
        fill: none;
        marker-end: url(#arrow);
      }

      .label {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #374151;
      }

      .noteBox {
        fill: #fafafa;
        stroke: #d1d5db;
        stroke-width: 1.5;
      }

      .noteTitle {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #374151;
      }

      .noteText {
        font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
        font-size: 14.5px;
        fill: #4b5563;
      }

      .code {
        font-family: "Consolas", "D2Coding", monospace;
        font-size: 16px;
        fill: #374151;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1250" height="1900" fill="#ffffff"/>

  <!-- ====================================================== -->
  <!-- TITLE -->
  <!-- ====================================================== -->

  <text x="625" y="52" class="title" text-anchor="middle">
    Counting Sort 구조도
  </text>

  <text x="625" y="84" class="subtitle" text-anchor="middle">
    빈도 계산 → 누적합 → 안정적인 위치 배치 → 정렬 결과 반영
  </text>

  <!-- ====================================================== -->
  <!-- START -->
  <!-- ====================================================== -->

  <rect x="450" y="120" width="350" height="72" rx="36"
        class="inputBox"/>

  <text x="625" y="151" class="text">
    입력 배열 values / a
  </text>

  <text x="625" y="177" class="small">
    n개의 정수 원소
  </text>

  <path d="M625 192 L625 232" class="arrow"/>

  <!-- ====================================================== -->
  <!-- N < 2 -->
  <!-- ====================================================== -->

  <polygon points="625,232 805,290 625,348 445,290"
           class="decision"/>

  <text x="625" y="285" class="decisionText">
    n &lt; 2 ?
  </text>

  <!-- YES -->
  <path d="M805 290 L1005 290 L1005 1745 L805 1745"
        class="arrow"/>

  <text x="875" y="272" class="label">
    예
  </text>

  <!-- NO -->
  <path d="M625 348 L625 390" class="arrow"/>

  <text x="645" y="374" class="label">
    아니오
  </text>

  <!-- ====================================================== -->
  <!-- MIN / MAX -->
  <!-- ====================================================== -->

  <rect x="305" y="390" width="640" height="135" rx="14"
        class="scanBox"/>

  <text x="625" y="425" class="sectionBlue">
    1. 최소값 / 최대값 탐색
  </text>

  <text x="625" y="458" class="text">
    min = a[0], max = a[0]
  </text>

  <text x="625" y="488" class="small">
    모든 원소를 순회하며 minimum과 maximum을 결정
  </text>

  <text x="625" y="515" class="small">
    음수 입력도 처리하기 위해 min을 기준점으로 사용
  </text>

  <path d="M625 525 L625 570" class="arrowBlue"/>

  <!-- ====================================================== -->
  <!-- RANGE -->
  <!-- ====================================================== -->

  <rect x="355" y="570" width="540" height="90" rx="12"
        class="box"/>

  <text x="625" y="605" class="text">
    range = max - min + 1
  </text>

  <text x="625" y="635" class="small">
    가능한 값의 범위를 계산
  </text>

  <path d="M625 660 L625 705" class="arrow"/>

  <!-- ====================================================== -->
  <!-- COUNT ARRAY INIT -->
  <!-- ====================================================== -->

  <rect x="285" y="705" width="680" height="125" rx="14"
        class="countBox"/>

  <text x="625" y="740" class="sectionGreen">
    2. Count 배열 초기화
  </text>

  <text x="625" y="774" class="text">
    count[0 ... range-1] = 0
  </text>

  <text x="625" y="804" class="small">
    각 값의 등장 횟수를 저장할 배열 생성
  </text>

  <path d="M625 830 L625 875" class="arrowGreen"/>

  <!-- ====================================================== -->
  <!-- COUNT FREQUENCY -->
  <!-- ====================================================== -->

  <rect x="275" y="875" width="700" height="145" rx="14"
        class="countBox"/>

  <text x="625" y="910" class="sectionGreen">
    3. 빈도 계산
  </text>

  <text x="625" y="946" class="text">
    index = value - min
  </text>

  <text x="625" y="977" class="text">
    count[index] += 1
  </text>

  <text x="625" y="1008" class="small">
    입력 배열의 모든 원소에 대해 해당 값의 등장 횟수를 기록
  </text>

  <path d="M625 1020 L625 1065" class="arrowGreen"/>

  <!-- ====================================================== -->
  <!-- PREFIX SUM -->
  <!-- ====================================================== -->

  <rect x="255" y="1065" width="740" height="145" rx="14"
        class="prefixBox"/>

  <text x="625" y="1100" class="sectionTeal">
    4. 누적합 계산
  </text>

  <text x="625" y="1136" class="text">
    count[i] += count[i - 1]
  </text>

  <text x="625" y="1167" class="small">
    각 값보다 작거나 같은 원소의 누적 개수를 계산
  </text>

  <text x="625" y="1193" class="small">
    → 각 원소가 output에 들어갈 위치를 결정할 수 있음
  </text>

  <path d="M625 1210 L625 1255" class="arrow"/>

  <!-- ====================================================== -->
  <!-- STABLE PLACEMENT -->
  <!-- ====================================================== -->

  <rect x="225" y="1255" width="800" height="185" rx="15"
        class="stableBox"/>

  <text x="625" y="1291" class="sectionOrange">
    5. Output 배열에 안정적으로 배치
  </text>

  <text x="625" y="1325" class="text">
    입력 배열을 오른쪽 → 왼쪽 방향으로 순회
  </text>

  <text x="625" y="1358" class="code" text-anchor="middle">
    offset = value - min
  </text>

  <text x="625" y="1386" class="code" text-anchor="middle">
    count[offset] -= 1
  </text>

  <text x="625" y="1414" class="code" text-anchor="middle">
    output[count[offset]] = value
  </text>

  <!-- Stable note -->
  <rect x="1005" y="1265" width="210" height="160" rx="12"
        class="noteBox"/>

  <text x="1110" y="1295" class="noteTitle" text-anchor="middle">
    안정성 유지
  </text>

  <text x="1022" y="1325" class="noteText">
    오른쪽에서 왼쪽으로
  </text>

  <text x="1022" y="1350" class="noteText">
    순회하기 때문에
  </text>

  <text x="1022" y="1375" class="noteText">
    같은 값을 가진 원소의
  </text>

  <text x="1022" y="1400" class="noteText">
    상대적 순서가 보존됨
  </text>

  <path d="M625 1440 L625 1485" class="arrowOrange"/>

  <!-- ====================================================== -->
  <!-- COPY BACK -->
  <!-- ====================================================== -->

  <rect x="275" y="1485" width="700" height="135" rx="14"
        class="copyBox"/>

  <text x="625" y="1520" class="sectionPurple">
    6. 정렬 결과를 원본 배열에 반영
  </text>

  <text x="625" y="1554" class="text">
    for i = 0 ... n-1
  </text>

  <text x="625" y="1585" class="code" text-anchor="middle">
    a[i] = output[i]
  </text>

  <path d="M625 1620 L625 1665" class="arrow"/>

  <!-- ====================================================== -->
  <!-- END -->
  <!-- ====================================================== -->

  <rect x="445" y="1665" width="360" height="80" rx="40"
        class="finish"/>

  <text x="625" y="1700" class="text">
    정렬 완료
  </text>

  <text x="625" y="1727" class="small">
    sorted array 반환
  </text>

  <!-- ====================================================== -->
  <!-- EXIT FROM n < 2 -->
  <!-- ====================================================== -->

  <rect x="805" y="1710" width="210" height="70" rx="35"
        class="finish"/>

  <text x="910" y="1741" class="text">
    즉시 반환
  </text>

  <text x="910" y="1765" class="small">
    n &lt; 2
  </text>
  <!-- ====================================================== -->
  <!-- RIGHT SIDE SUMMARY -->
  <!-- ====================================================== -->

  <rect x="45" y="560" width="215" height="310" rx="12"
        class="noteBox"/>

  <text x="152" y="594" class="noteTitle" text-anchor="middle">
    핵심 데이터 구조
  </text>

  <text x="65" y="630" class="noteText">
    ① 입력 배열
  </text>

  <text x="65" y="658" class="noteText">
    ② count[]
  </text>

  <text x="65" y="686" class="noteText">
    ③ output[]
  </text>

  <line x1="65" y1="710" x2="240" y2="710"
        stroke="#d1d5db" stroke-width="1"/>

  <text x="65" y="740" class="noteText">
    count[] :
  </text>

  <text x="65" y="765" class="noteText">
    각 값의 빈도와
  </text>

  <text x="65" y="790" class="noteText">
    누적 위치를 저장
  </text>

  <text x="65" y="830" class="noteText">
    output[] :
  </text>

  <text x="65" y="855" class="noteText">
    최종 정렬 결과 저장
  </text>

  <!-- ====================================================== -->
  <!-- FORMULA SUMMARY -->
  <!-- ====================================================== -->

  <rect x="100" y="1800" width="1050" height="65" rx="10"
        class="noteBox"/>

  <text x="625" y="1827" class="noteText" text-anchor="middle">
    핵심 구조: min/max 탐색 → count 배열 생성 → 빈도 계산 → 누적합 → 오른쪽에서 왼쪽으로 stable 배치 → output을 원본 배열에 복사
  </text>

  <text x="625" y="1853" class="noteText" text-anchor="middle">
    시간 복잡도: O(n + k), 여기서 k는 값의 범위(range = max - min + 1)
  </text>

</svg>
