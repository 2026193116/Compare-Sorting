<svg xmlns="http://www.w3.org/2000/svg"
     width="1500"
     height="2050"
     viewBox="0 0 1500 2050">

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="10" refY="5.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>

    <style>
      .title { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
               font-size:34px;font-weight:700;fill:#111827; }
      .subtitle { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                  font-size:17px;fill:#6b7280; }
      .text { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
              font-size:18px;fill:#111827;text-anchor:middle; }
      .small { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
               font-size:14.5px;fill:#4b5563;text-anchor:middle; }
      .label { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
               font-size:15px;font-weight:600;fill:#374151; }
      .code { font-family:"Consolas","D2Coding",monospace;
              font-size:15.5px;fill:#374151;text-anchor:middle; }
      .codeLeft { font-family:"Consolas","D2Coding",monospace;
                  font-size:14px;fill:#374151; }
      .sectionBlue { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                     font-size:18px;font-weight:700;fill:#1d4ed8;text-anchor:middle; }
      .sectionGreen { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                      font-size:18px;font-weight:700;fill:#047857;text-anchor:middle; }
      .sectionOrange { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                       font-size:18px;font-weight:700;fill:#b45309;text-anchor:middle; }
      .sectionPurple { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                       font-size:18px;font-weight:700;fill:#6d28d9;text-anchor:middle; }
      .decisionText { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                      font-size:16px;font-weight:600;fill:#92400e;text-anchor:middle; }
      .noteTitle { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                   font-size:16px;font-weight:700;fill:#374151; }
      .noteText { font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
                  font-size:13.5px;fill:#4b5563; }
      .box { fill:#fff;stroke:#374151;stroke-width:2; }
      .inputBox { fill:#f9fafb;stroke:#4b5563;stroke-width:2; }
      .gapBox { fill:#eff6ff;stroke:#2563eb;stroke-width:2.5; }
      .loopBox { fill:#ecfdf5;stroke:#059669;stroke-width:2.5; }
      .compareBox { fill:#fff7ed;stroke:#d97706;stroke-width:2.5; }
      .shiftBox { fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5; }
      .finish { fill:#f3f4f6;stroke:#374151;stroke-width:2; }
      .decision { fill:#fffbeb;stroke:#d97706;stroke-width:2; }
      .sideBox { fill:#fafafa;stroke:#d1d5db;stroke-width:1.5; }
      .nested { fill:none;stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 5; }
      .arrow { stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow); }
      .arrowBlue { stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue); }
      .arrowGreen { stroke:#059669;stroke-width:2.5;fill:none;marker-end:url(#arrowGreen); }
      .arrowOrange { stroke:#d97706;stroke-width:2.5;fill:none;marker-end:url(#arrowOrange); }
      .arrowPurple { stroke:#7c3aed;stroke-width:2.5;fill:none;marker-end:url(#arrowPurple); }
      .loop { stroke:#6b7280;stroke-width:2.2;stroke-dasharray:8 5;fill:none;marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="2050" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="50" class="title" text-anchor="middle">Shell Sort 구조도</text>
  <text x="750" y="82" class="subtitle" text-anchor="middle">
    큰 gap에서 시작해 gap을 절반씩 줄이며, 각 단계에서 gap 간격의 삽입 정렬을 수행
  </text>

  <!-- Start -->
  <rect x="470" y="115" width="560" height="72" rx="36" class="inputBox"/>
  <text x="750" y="146" class="text">입력 배열 a / values</text>
  <text x="750" y="172" class="small">n개의 원소를 가진 배열</text>
  <path d="M750 187 L750 225" class="arrow"/>

  <!-- Gap initialization -->
  <rect x="395" y="225" width="710" height="118" rx="14" class="gapBox"/>
  <text x="750" y="258" class="sectionBlue">1. 초기 gap 설정</text>
  <text x="750" y="292" class="code">gap = n / 4</text>
  <text x="750" y="319" class="small">gap == 0이면 gap = 1</text>
  <text x="750" y="338" class="small">C: size_t gap = n / 4 &#160;&#160;|&#160;&#160; Python: gap = n // 4</text>
  <path d="M750 343 L750 390" class="arrowBlue"/>

  <!-- Outer loop decision -->
  <polygon points="750,390 925,445 750,500 575,445" class="decision"/>
  <text x="750" y="450" class="decisionText">gap &gt; 0 ?</text>

  <!-- NO -> finish -->
  <path d="M925 445 L1190 445 L1190 1870 L1010 1870" class="arrow"/>
  <text x="950" y="426" class="label">아니오 → 종료</text>

  <!-- YES -->
  <path d="M750 500 L750 540" class="arrow"/>
  <text x="772" y="526" class="label">예</text>

  <!-- Outer for loop container -->
  <rect x="330" y="540" width="840" height="1130" rx="18" class="loopBox"/>
  <text x="750" y="575" class="sectionGreen">2. 현재 gap에서 전체 배열을 gap-insertion sort</text>
  <text x="750" y="607" class="code">for i = gap ... n-1</text>
  <text x="750" y="633" class="small">
    i를 1씩 증가시키며 각 원소를 자신의 gap-부분배열에 삽입
  </text>

  <!-- For-loop start -->
  <path d="M750 653 L750 680" class="arrowGreen"/>

  <rect x="425" y="680" width="650" height="105" rx="13" class="box"/>
  <text x="750" y="712" class="sectionBlue">3. 현재 원소 준비</text>
  <text x="750" y="742" class="code">value = a[i]</text>
  <text x="750" y="769" class="code">j = i</text>

  <path d="M750 785 L750 825" class="arrow"/>

  <!-- Inner while decision -->
  <polygon points="750,825 930,880 750,935 570,880" class="decision"/>
  <text x="750" y="885" class="decisionText">j &gt;= gap ?</text>

  <!-- NO inner while -> insertion: shift box를 우회하여 삽입 단계로 -->
  <path d="M570 880 L245 880 L245 1345 L425 1345" class="arrow"/>
  <text x="485" y="860" class="label">아니오</text>

  <!-- YES -> compare -->
  <path d="M750 935 L750 965" class="arrowOrange"/>
  <text x="772" y="955" class="label">예</text>

  <!-- Compare -->
  <rect x="425" y="965" width="650" height="122" rx="14" class="compareBox"/>
  <text x="750" y="997" class="sectionOrange">4. gap만큼 떨어진 이전 원소와 비교</text>
  <text x="750" y="1029" class="code">a[j - gap] &lt;= value ?</text>
  <text x="750" y="1058" class="small">비교를 수행할 때마다 comparisons += 1</text>
  <text x="750" y="1079" class="small">같거나 작으면 현재 위치에 그대로 두고 inner while 종료</text>

  <!-- Compare YES -> insertion: shift를 거치지 않고 삽입 단계로 -->
  <path d="M425 1026 L245 1026 L245 1345 L425 1345" class="arrowOrange"/>
  <text x="310" y="1008" class="label">예 → break</text>

  <!-- Compare NO -> shift -->
  <path d="M750 1087 L750 1120" class="arrowPurple"/>
  <text x="772" y="1109" class="label">아니오</text>

  <!-- Shift -->
  <rect x="425" y="1120" width="650" height="135" rx="14" class="shiftBox"/>
  <text x="750" y="1152" class="sectionPurple">5. gap만큼 뒤로 이동</text>
  <text x="750" y="1183" class="code">a[j] = a[j - gap]</text>
  <text x="750" y="1211" class="code">j -= gap</text>
  <text x="750" y="1239" class="small">이동마다 moves += 1</text>

  <!-- Shift loop back: visually returns to inner condition -->
  <path d="M1075 1187 L1115 1187 L1115 880 L930 880" class="loop"/>
  <text x="1132" y="1065" class="label" transform="rotate(-90 1132 1065)">
    다시 j &gt;= gap 확인
  </text>

  <!-- Insertion -->
  <rect x="425" y="1275" width="650" height="140" rx="14" class="box"/>
  <text x="750" y="1307" class="sectionBlue">6. value 삽입</text>
  <text x="750" y="1338" class="code">if j != i:</text>
  <text x="750" y="1366" class="code">a[j] = value</text>
  <text x="750" y="1395" class="small">실제로 이동했다면 moves += 1</text>
  <text x="438" y="1338" class="label">while 종료</text>

  <!-- Shift -> insertion: shift가 끝난 뒤 value를 삽입 -->
  <path d="M750 1255 L750 1275" class="arrowPurple"/>

  <!-- i loop decision -->
  <path d="M750 1415 L750 1448" class="arrow"/>
  <polygon points="750,1448 910,1498 750,1548 590,1498" class="decision"/>
  <text x="750" y="1503" class="decisionText">i &lt; n ?</text>

  <!-- YES: next i -->
  <path d="M590 1498 L370 1498 L370 622 L330 622" class="loop"/>
  <text x="398" y="1478" class="label">예 → 다음 i</text>

  <!-- NO: exit for loop -->
  <path d="M750 1548 L750 1625" class="arrow"/>
  <text x="772" y="1587" class="label">아니오 → 현재 gap 완료</text>

  <!-- Note on for-loop increment -->
  <rect x="790" y="1430" width="330" height="92" rx="10" class="sideBox"/>
  <text x="810" y="1455" class="noteTitle">for문의 실제 의미</text>
  <text x="810" y="1478" class="noteText">C: i가 1씩 증가</text>
  <text x="810" y="1499" class="noteText">Python: index가 1씩 증가</text>

  <!-- Gap decrease -->
  <rect x="425" y="1625" width="650" height="120" rx="14" class="gapBox"/>
  <text x="750" y="1657" class="sectionBlue">7. gap 감소</text>
  <text x="750" y="1690" class="code">gap /= 2 &#160;&#160; / &#160;&#160; gap //= 2</text>
  <text x="750" y="1718" class="small">C: 정수 나눗셈으로 절반 &#160;&#160; Python: // 연산으로 절반</text>
  <path d="M425 1685 L205 1685 L205 445 L575 445" class="loop"/>
  <text x="188" y="1135" class="label" transform="rotate(-90 188 1135)">
    다음 gap 단계로 돌아감
  </text>

  <!-- Finish -->
  <rect x="510" y="1820" width="480" height="72" rx="36" class="finish"/>
  <text x="750" y="1851" class="text">gap == 0 → 정렬 완료</text>
  <text x="750" y="1876" class="small">최종적으로 전체 배열이 오름차순 정렬됨</text>

  <!-- Outer-loop finish connector -->
  <path d="M1190 1870 L990 1870" class="arrow"/>

  <!-- Side explanation -->
  <rect x="1130" y="560" width="300" height="560" rx="14" class="sideBox"/>
  <text x="1280" y="592" class="noteTitle" text-anchor="middle">구조를 읽는 핵심</text>

  <text x="1155" y="630" class="noteText">① 바깥쪽 while</text>
  <text x="1155" y="653" class="noteText">   gap을 계속 줄인다.</text>

  <text x="1155" y="695" class="noteText">② 가운데 for</text>
  <text x="1155" y="718" class="noteText">   i = gap부터 n-1까지</text>
  <text x="1155" y="741" class="noteText">   모든 원소를 처리한다.</text>

  <text x="1155" y="783" class="noteText">③ 안쪽 while</text>
  <text x="1155" y="806" class="noteText">   j를 gap씩 감소시키며</text>
  <text x="1155" y="829" class="noteText">   이전 원소를 검사한다.</text>

  <text x="1155" y="871" class="noteText">④ 비교 결과</text>
  <text x="1155" y="894" class="noteText">   a[j-gap] ≤ value</text>
  <text x="1155" y="917" class="noteText">   → break</text>
  <text x="1155" y="940" class="noteText">   아니면 → shift → j -= gap</text>

  <text x="1155" y="982" class="noteText">⑤ while 종료 후</text>
  <text x="1155" y="1005" class="noteText">   이동이 있었다면</text>
  <text x="1155" y="1028" class="noteText">   value를 a[j]에 삽입한다.</text>

  <text x="1155" y="1070" class="noteText">⑥ for가 끝나면</text>
  <text x="1155" y="1093" class="noteText">   gap을 절반으로 줄인다.</text>

  <!-- C/Python correspondence -->
  <rect x="1130" y="1160" width="300" height="420" rx="14" class="sideBox"/>
  <text x="1280" y="1192" class="noteTitle" text-anchor="middle">C ↔ Python 대응</text>

  <text x="1150" y="1230" class="codeLeft">C: value = a[i]</text>
  <text x="1150" y="1254" class="codeLeft">Py: value = result[index]</text>

  <text x="1150" y="1294" class="codeLeft">C: j = i</text>
  <text x="1150" y="1318" class="codeLeft">Py: position = index</text>

  <text x="1150" y="1358" class="codeLeft">C: a[j] = a[j-gap]</text>
  <text x="1150" y="1382" class="codeLeft">Py: result[position]</text>
  <text x="1150" y="1404" class="codeLeft">    = result[position-gap]</text>

  <text x="1150" y="1444" class="codeLeft">C: j -= gap</text>
  <text x="1150" y="1468" class="codeLeft">Py: position -= gap</text>

  <text x="1150" y="1508" class="codeLeft">C: gap /= 2</text>
  <text x="1150" y="1532" class="codeLeft">Py: gap //= 2</text>

  <!-- Bottom conceptual summary -->
  <rect x="220" y="1925" width="1060" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="1955" class="noteTitle" text-anchor="middle">
    핵심: Shell Sort = gap을 둔 삽입 정렬을 여러 gap에 대해 반복
  </text>
  <text x="750" y="1982" class="noteText" text-anchor="middle">
    gap이 클 때 멀리 떨어진 원소를 먼저 정리하고 → gap을 줄이면서 → gap = 1에서 일반적인 삽입 정렬 형태로 마무리
  </text>
</svg>
