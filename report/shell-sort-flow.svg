<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620">
<style>text{font:16px sans-serif;fill:#18212f}.title{font-size:25px;font-weight:700}.step{fill:#edf4fb;stroke:#52739b;stroke-width:2}.decision{fill:#fff4d6;stroke:#c58a18;stroke-width:2}.end{fill:#e7f5e9;stroke:#4c956c;stroke-width:2}.arrow{stroke:#52606d;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
<text class="title" x="550" y="34" text-anchor="middle">셸 정렬 진행 구조</text>
<rect class="step" x="410" y="55" width="280" height="52" rx="10"/><text x="550" y="87" text-anchor="middle">gap = max(n / 4, 1)</text>
<path class="arrow" d="M550 107 V135"/>
<rect class="decision" x="400" y="135" width="300" height="65" rx="10"/><text x="550" y="163" text-anchor="middle">gap &gt; 0 인가?</text><text x="550" y="185" text-anchor="middle">아니오 → 종료</text>
<path class="arrow" d="M400 168 H210 V235"/><text x="300" y="158" text-anchor="middle">예</text>
<rect class="step" x="55" y="235" width="310" height="66" rx="10"/><text x="210" y="263" text-anchor="middle">i = gap부터 n-1까지</text><text x="210" y="285" text-anchor="middle">value = a[i], j = i</text>
<path class="arrow" d="M365 268 H500"/>
<rect class="decision" x="500" y="225" width="300" height="86" rx="10"/><text x="650" y="255" text-anchor="middle">j ≥ gap 이고</text><text x="650" y="279" text-anchor="middle">a[j-gap] &gt; value 인가?</text>
<path class="arrow" d="M650 311 V370"/><text x="690" y="345">예</text>
<rect class="step" x="500" y="370" width="300" height="60" rx="10"/><text x="650" y="406" text-anchor="middle">a[j] = a[j-gap]; j -= gap</text><path class="arrow" d="M500 400 H440 V268 H365"/>
<path class="arrow" d="M800 268 H930 V470 H650"/><text x="850" y="255">아니오</text>
<rect class="step" x="500" y="470" width="300" height="60" rx="10"/><text x="650" y="506" text-anchor="middle">a[j] = value</text><path class="arrow" d="M500 500 H420 V555 H550"/>
<rect class="step" x="410" y="555" width="280" height="45" rx="10"/><text x="550" y="583" text-anchor="middle">gap /= 2 → 다음 gap</text>
</svg>
