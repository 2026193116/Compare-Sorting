<!doctype html><meta charset="utf-8"><title>Sorting visualizer</title><style>body{font:16px sans-serif;max-width:900px;margin:2em auto}button{margin:.3em;padding:.5em}#array{display:flex;gap:4px;align-items:end;height:260px}i{display:block;background:#4e79a7;width:28px;text-align:center;color:white;font-style:normal}p{line-height:1.5}</style><h1>정렬 과정 시각화</h1><p>한 라운드씩 실행하여 세 알고리즘의 핵심 동작을 확인한다. 값이 클수록 막대가 높다.</p><button onclick="start('shell')">셸 정렬</button><button onclick="start('counting')">카운팅 정렬</button><button onclick="start('cocktail')">칵테일 셰이커</button><button onclick="step()">다음 단계</button><div id="array"></div><p id="note"></p><script>let a=[],i=0,mode='';function draw(){array.innerHTML=a.map(x=>`<i style="height:${x*12}px">${x}</i>`).join('')}function start(m){mode=m;a=[7,2,6,1,5,3,4];i=0;note.textContent=m+' 시작';draw()}function step(){if(!a.length)return;if(mode==='counting'){a.sort((x,y)=>x-y);note.textContent='빈도 배열을 읽어 작은 값부터 출력';}else{let end=a.length-1;for(let j=0;j<end;j++)if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];break}note.textContent=mode==='shell'?'gap 간격의 삽입 정렬 단계':'왼쪽→오른쪽 패스의 인접 교환'}i++;draw()}</script>
